name: agent-farm
instructions: |
  Use gh for GitHub tasks, over HTTPS.

  Documents written for a person are published to Grain as well as saved locally.
  Grain destination: organization YA8g3DZBN8j8x0l8Oq7Gb (DCouple),
  folder Development Artifacts/DCouple/agent-farm. Pass the organization
  explicitly on every Grain call.

  The local bundle under tmp/greenfield/<slug>/ stays the working copy. Publish
  each bundle to one private Grain workspace (html template) named after the
  bundle's title. One bundle maps to one workspace: if bundle.json has a
  published.id, check out and push to that workspace, and never create a second.
  Keep the bundle's layout and relative links unchanged inside the workspace:
  index.html, options.html, cover-sheet.html, explainers/, mockups/, evidence/,
  bundle.json.
  After the first publish, set bundle.json "destination" to "grain" and record
  under "published" the kind "grain", the workspace id, its open URL, the
  organization, and the folder. Push again after every revision of a page.
  Verify each push (a revision was recorded and the workspace is listed in the
  folder) and report failures plainly. A local save is not a publish.
  Keep workspaces private. Share only when the person asks.
connections:
  grain:
    description: |
      Publish and update Agent Farm documents. Use organization
      YA8g3DZBN8j8x0l8Oq7Gb (DCouple), passing it explicitly to discovery and
      creation tools.
    type: mcp
    command: grain
    args: [mcp]
